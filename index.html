<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCB - TATA IPL Champions 2026</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#8B0000,#000000);
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.container{
    text-align:center;
    z-index:2;
}

h1{
    font-size:4rem;
    color:#FFD700;
    text-shadow:0 0 20px gold;
    animation:glow 2s infinite alternate;
}

h2{
    font-size:2rem;
    margin-top:15px;
    color:#ffffff;
}

.trophy{
    font-size:120px;
    margin:20px 0;
    animation:lift 2s ease-in-out infinite;
}

.team{
    font-size:2.5rem;
    color:#ff4d4d;
    font-weight:bold;
    margin-top:10px;
}

.tagline{
    margin-top:15px;
    font-size:1.3rem;
    color:#f5f5f5;
}

@keyframes glow{
    from{
        text-shadow:0 0 10px gold;
    }
    to{
        text-shadow:0 0 30px gold,
                     0 0 50px orange;
    }
}

@keyframes lift{
    0%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-25px);
    }
    100%{
        transform:translateY(0);
    }
}

/* Confetti */
.confetti{
    position:absolute;
    width:10px;
    height:10px;
    top:-10px;
    animation:fall linear infinite;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>🏆 TATA IPL CHAMPIONS 2026 🏆</h1>

    <div class="trophy">🏆</div>

    <div class="team">
        ROYAL CHALLENGERS BANGALORE
    </div>

    <h2>Finally, The Crown Belongs To RCB!</h2>

    <p class="tagline">
        Ee Sala Cup Namdu ❤️🖤
    </p>
</div>

<script>
function createConfetti() {
    const colors = [
        "#FFD700",
        "#FF0000",
        "#FFFFFF",
        "#FFA500"
    ];

    for(let i=0;i<150;i++){
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");

        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.backgroundColor =
            colors[Math.floor(Math.random()*colors.length)];

        confetti.style.animationDuration =
            (Math.random()*4 + 3) + "s";

        confetti.style.opacity = Math.random();

        document.body.appendChild(confetti);
    }
}

createConfetti();
</script>

</body>
</html>
